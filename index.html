<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Your Florida Keys Agent Content Calendar</title>
<meta name="theme-color" content="#1B7A73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YFKA Calendar">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F4F5F7;
    --panel:#FFFFFF;
    --ink:#1A1D29;
    --ink-soft:#585C68;
    --ink-faint:#9297A3;
    --line:#DCDFE5;
    --line-soft:#EAECEF;
    --teal:#1B7A73;
    --teal-deep:#125650;
    --coral:#E2704F;
    --coral-deep:#B85138;
    --pink:#E15C82;
    --pink-deep:#A83E60;
    --inkchip:#125650;
    --radius:3px;
    --radius-lg:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',sans-serif;}
  body{min-height:100vh;}
  ::selection{background:#1B7A7333;}

  .app{max-width:1180px;margin:0 auto;padding:28px 24px 64px;}

  /* Header */
  header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
  .brand{display:flex;align-items:baseline;gap:10px;max-width:640px;}
  .brand h1{font-family:'Fraunces',serif;font-style:normal;font-weight:500;font-size:22px;line-height:1.25;margin:0;letter-spacing:-0.01em;}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);}
  .who button{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px;font-family:inherit;font-size:12px;color:var(--ink-soft);cursor:pointer;}
  .who button:hover{border-color:var(--ink-faint);color:var(--ink);}
  .who button#saveAllBtn{border-color:var(--teal);color:var(--teal);font-weight:600;}
  .who button#saveAllBtn:hover{background:var(--teal);color:#fff;}

  /* Toolbar */
  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
  .nav{display:flex;align-items:center;gap:14px;}
  .nav button.arrow{background:var(--panel);border:1px solid var(--line);width:32px;height:32px;border-radius:var(--radius);cursor:pointer;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .nav button.arrow:hover{border-color:var(--ink-faint);color:var(--ink);}
  .nav .month{font-family:'Fraunces',serif;font-weight:500;font-size:20px;min-width:190px;text-align:center;}
  .nav button.today{background:none;border:none;font-size:12px;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit;}

  .actions{display:flex;align-items:center;gap:10px;}
  .btn-primary{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:8px 12px;border-radius:var(--radius);font-family:inherit;font-size:12px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink);}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip-filter{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 12px 5px 9px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-soft);user-select:none;}
  .chip-filter .sw{width:8px;height:8px;border-radius:50%;}
  .chip-filter.off{opacity:.4;}
  .chip-filter:hover{border-color:var(--ink-faint);}

  /* Calendar grid */
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px;}
  .weekdays div{font-size:11px;letter-spacing:.04em;color:var(--ink-faint);padding:0 6px 8px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(108px,auto);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;}
  .cell{background:var(--panel);padding:8px;position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;}
  .cell.out{background:#FAFAFB;}
  .cell.out .daynum{color:var(--ink-faint);}
  .cell-head{display:flex;justify-content:space-between;align-items:center;}
  .daynum{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .daynum.today{background:var(--coral);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .addbtn{opacity:0;border:none;background:none;color:var(--ink-faint);font-size:15px;cursor:pointer;line-height:1;padding:0 2px;}
  .cell:hover .addbtn{opacity:1;}

  .post-chip{border-left:3px solid var(--inkchip);background:var(--line-soft);border-radius:2px;padding:3px 6px;font-size:11px;line-height:1.35;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .post-chip:hover{filter:brightness(0.97);}
  .post-chip .stat{flex-shrink:0;font-size:10px;opacity:.7;}
  .post-chip .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .more-link{font-size:11px;color:var(--ink-faint);cursor:pointer;padding:2px 6px;}
  .more-link:hover{color:var(--ink);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(26,29,41,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:var(--radius-lg);width:100%;max-width:420px;padding:24px;max-height:88vh;overflow:auto;}
  .modal h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:5px;text-transform:none;}
  .field input[type=text], .field input[type=date], .field textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--paper);}
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .field input[type=file]{font-size:12px;color:var(--ink-soft);}
  .media-preview{margin-top:8px;display:none;align-items:center;gap:10px;}
  .media-preview.show{display:flex;}
  .media-preview img, .media-preview video{width:64px;height:64px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);background:#000;}
  .media-preview .meta{font-size:11px;color:var(--ink-faint);flex:1;}
  .media-preview .rm{background:none;border:1px solid var(--line);border-radius:var(--radius);color:var(--coral);font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit;}
  .media-note{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .chip-media{flex-shrink:0;font-size:10px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .seg button .sw{width:8px;height:8px;border-radius:50%;}
  .seg button.active{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--line-soft);}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .link-danger{background:none;border:none;color:var(--coral);font-size:12px;cursor:pointer;font-family:inherit;}
  .link-danger:hover{text-decoration:underline;}
  .modal-right{display:flex;gap:8px;}

  .day-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .day-list .post-chip{white-space:normal;}

  .empty-note{font-size:12px;color:var(--ink-faint);text-align:center;padding:60px 0;}

  .setup-banner{background:#FFF4E5;border:1px solid #E8B85A;color:#6B4E1E;font-size:13px;padding:12px 16px;border-radius:var(--radius);margin-bottom:18px;line-height:1.5;}

  @media (max-width:640px){
    .grid{grid-auto-rows:minmax(84px,auto);}
    .weekdays div:nth-child(n){font-size:9px;}
    .cell{padding:5px;}
    .nav .month{min-width:auto;font-size:16px;}
    .app{padding:18px 12px 40px;}
  }
</style>
</head>
<body>
<div class="app">

  <div id="setupBanner" class="setup-banner" style="display:none;">
    <strong>Almost there —</strong> add your Supabase URL and anon key at the top of the &lt;script&gt; section in this file, then reload the page. See the setup notes that came with this file for the exact steps.
  </div>

  <header class="top">
    <div class="brand">
      <h1>Your Florida Keys Agent Content Calendar</h1>
    </div>
    <div class="who">
      <button id="saveAllBtn">Save</button>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="nav">
      <button class="arrow" id="prevBtn">‹</button>
      <div class="month" id="monthLabel">—</div>
      <button class="arrow" id="nextBtn">›</button>
      <button class="today" id="todayBtn">Today</button>
    </div>
    <div class="actions">
      <button class="btn-primary" id="newPostBtn">+ New post</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="weekdays">
    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Post editor modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="postModal">
    <h2 id="modalTitle">New post</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="What are you publishing?">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>Platform</label>
      <div class="seg" id="fPlatform"></div>
    </div>
    <div class="field">
      <label>Status</label>
      <div class="seg" id="fStatus"></div>
    </div>
    <div class="field">
      <label>Photo or video</label>
      <input type="file" id="fMedia" accept="image/*,video/*">
      <div id="mediaPreview" class="media-preview"></div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Brief, links, hooks…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="link-danger" id="deleteBtn" style="visibility:hidden;">Delete post</button>
      <div class="modal-right">
        <button class="btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Day overflow modal -->
<div class="overlay" id="dayOverlay">
  <div class="modal">
    <h2 id="dayModalTitle">Posts</h2>
    <div class="day-list" id="dayList"></div>
    <div class="modal-actions">
      <div></div>
      <button class="btn-ghost" id="dayCloseBtn">Close</button>
    </div>
  </div>
</div>

<script>
const PLATFORMS = [
  {id:'instagram', label:'Instagram', color:'var(--pink)'},
  {id:'facebook', label:'Facebook', color:'var(--teal-deep)'},
  {id:'linkedin', label:'LinkedIn', color:'var(--coral-deep)'},
  {id:'blog', label:'Blog', color:'var(--pink-deep)'},
  {id:'youtube', label:'YouTube', color:'var(--teal)'},
];
const STATUSES = [
  {id:'idea', label:'Idea', icon:'○'},
  {id:'draft', label:'Draft', icon:'◐'},
  {id:'scheduled', label:'Scheduled', icon:'●'},
  {id:'published', label:'Published', icon:'✓'},
];

let posts = [];
let viewYear, viewMonth; // 0-indexed month
let activeFilters = new Set(PLATFORMS.map(p=>p.id));
let editingId = null;

const $ = (id)=>document.getElementById(id);

function resolveColor(varStr){
  return getComputedStyle(document.documentElement).getPropertyValue(varStr.replace('var(','').replace(')','')).trim() || varStr;
}
function platformColor(id){
  const p = PLATFORMS.find(p=>p.id===id);
  return p ? p.color : 'var(--inkchip)';
}
function statusIcon(id){
  const s = STATUSES.find(s=>s.id===id);
  return s ? s.icon : '○';
}
function pad(n){return n<10?'0'+n:''+n;}
function dateKey(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}

// ====== SUPABASE CONFIG — fill these in from your Supabase project settings ======
const SUPABASE_URL = 'https://ewtyqmzqzccznkfkusxr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ag73q4f2nFXAfetfoa6AJg_62nZ0n9_';
// ===================================================================================

let supabaseReady = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 20;
let supabaseClient = null;
let supabaseLibMissing = false;
if(supabaseReady){
  try{
    if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
      supabaseLibMissing = true;
      supabaseReady = false;
    } else {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  }catch(e){
    console.error('Supabase init error', e);
    supabaseReady = false;
  }
}

async function loadPosts(){
  if(!supabaseReady){ posts = []; return; }
  try{
    const { data, error } = await supabaseClient
      .from('calendar_kv')
      .select('value')
      .eq('key', 'posts')
      .maybeSingle();
    if(error) throw error;
    posts = data && data.value ? data.value : [];
  }catch(e){
    console.error('Load error', e);
    posts = [];
  }
}

async function savePosts(){
  if(!supabaseReady){ alert('Supabase isn\'t configured yet — see the setup note at the top of the page.'); return false; }
  try{
    const { error } = await supabaseClient
      .from('calendar_kv')
      .upsert({ key: 'posts', value: posts, updated_at: new Date().toISOString() });
    if(error) throw error;
    return true;
  }catch(e){
    console.error('Storage error', e);
    alert('Could not save.\n\nError: ' + (e && e.message ? e.message : JSON.stringify(e)) + (e && e.hint ? ('\nHint: ' + e.hint) : ''));
    return false;
  }
}

function buildFilters(){
  const wrap = $('filters');
  wrap.innerHTML = '';
  PLATFORMS.forEach(p=>{
    const chip = document.createElement('div');
    chip.className = 'chip-filter' + (activeFilters.has(p.id) ? '' : ' off');
    chip.innerHTML = `<span class="sw" style="background:${p.color}"></span>${p.label}`;
    chip.onclick = ()=>{
      if(activeFilters.has(p.id)) activeFilters.delete(p.id); else activeFilters.add(p.id);
      buildFilters(); renderGrid();
    };
    wrap.appendChild(chip);
  });
}

function renderGrid(){
  const grid = $('grid');
  grid.innerHTML = '';
  const first = new Date(viewYear, viewMonth, 1);
  let startOffset = (first.getDay() + 6) % 7; // make Monday=0
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const todayStr = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    const m = viewMonth===0?11:viewMonth-1, y = viewMonth===0?viewYear-1:viewYear;
    cells.push({d, m, y, out:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({d, m:viewMonth, y:viewYear, out:false});
  while(cells.length % 7 !== 0){
    const last = cells[cells.length-1];
    const nd = last.d+1;
    const m = viewMonth===11?0:viewMonth+1, y = viewMonth===11?viewYear+1:viewYear;
    cells.push({d: (cells.length - (startOffset+daysInMonth)) +1, m, y, out:true});
  }

  cells.forEach(c=>{
    const key = dateKey(c.y, c.m, c.d);
    const cell = document.createElement('div');
    cell.className = 'cell' + (c.out ? ' out' : '');
    const head = document.createElement('div');
    head.className = 'cell-head';
    const num = document.createElement('div');
    num.className = 'daynum' + (key===todayStr ? ' today' : '');
    num.textContent = c.d;
    const addBtn = document.createElement('button');
    addBtn.className = 'addbtn';
    addBtn.textContent = '+';
    addBtn.onclick = ()=>openEditor(null, key);
    head.appendChild(num); head.appendChild(addBtn);
    cell.appendChild(head);

    const dayPosts = posts.filter(p=>p.date===key && activeFilters.has(p.platform))
                           .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const maxShow = 3;
    dayPosts.slice(0,maxShow).forEach(p=>{
      const chip = document.createElement('div');
      chip.className = 'post-chip';
      chip.style.borderLeftColor = platformColor(p.platform);
      chip.innerHTML = `<span class="stat">${statusIcon(p.status)}</span><span class="ttl">${escapeHtml(p.title)}</span>${p.media ? `<span class="chip-media">${p.media.type==='video'?'🎬':'🖼'}</span>` : ''}`;
      chip.onclick = ()=>openEditor(p.id);
      cell.appendChild(chip);
    });
    if(dayPosts.length > maxShow){
      const more = document.createElement('div');
      more.className = 'more-link';
      more.textContent = `+${dayPosts.length - maxShow} more`;
      more.onclick = ()=>openDayModal(key, dayPosts);
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  });

  $('monthLabel').textContent = first.toLocaleDateString('en-US',{month:'long', year:'numeric'});
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}

function openDayModal(key, dayPosts){
  $('dayModalTitle').textContent = new Date(key+'T00:00:00').toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const list = $('dayList');
  list.innerHTML = '';
  dayPosts.forEach(p=>{
    const chip = document.createElement('div');
    chip.className = 'post-chip';
    chip.style.borderLeftColor = platformColor(p.platform);
    chip.innerHTML = `<span class="stat">${statusIcon(p.status)}</span><span class="ttl">${escapeHtml(p.title)}</span>${p.media ? `<span class="chip-media">${p.media.type==='video'?'🎬':'🖼'}</span>` : ''}`;
    chip.onclick = ()=>{ closeDayModal(); openEditor(p.id); };
    list.appendChild(chip);
  });
  $('dayOverlay').classList.add('show');
}
function closeDayModal(){ $('dayOverlay').classList.remove('show'); }

function buildSeg(container, items, selectedId, onSelect){
  container.innerHTML = '';
  items.forEach(it=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'active' === (it.id===selectedId?'active':'') ? '' : '';
    if(it.id===selectedId) btn.classList.add('active');
    const sw = it.color ? `<span class="sw" style="background:${it.color}"></span>` : (it.icon?`<span>${it.icon}</span>`:'');
    btn.innerHTML = `${sw}${it.label}`;
    btn.onclick = ()=>{ onSelect(it.id); buildSeg(container, items, it.id, onSelect); };
    container.appendChild(btn);
  });
}

let currentPlatform = 'instagram';
let currentStatus = 'idea';
let currentMedia = null; // {type:'image'|'video', data: dataURL, name, size}

const MAX_MEDIA_BYTES = 3 * 1024 * 1024; // ~3MB per attachment, keeps shared storage healthy

function renderMediaPreview(){
  const box = $('mediaPreview');
  if(!currentMedia){ box.className = 'media-preview'; box.innerHTML = ''; return; }
  box.className = 'media-preview show';
  const tag = currentMedia.type === 'video'
    ? `<video src="${currentMedia.data}" muted></video>`
    : `<img src="${currentMedia.data}" alt="">`;
  box.innerHTML = `${tag}<div class="meta">${escapeHtml(currentMedia.name || 'attachment')}</div><button type="button" class="rm" id="removeMediaBtn">Remove</button>`;
  $('removeMediaBtn').onclick = ()=>{ currentMedia = null; $('fMedia').value=''; renderMediaPreview(); };
}

function handleMediaFile(file){
  if(!file) return;
  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');
  if(!isVideo && !isImage){ alert('Please choose an image or video file.'); return; }
  if(file.size > MAX_MEDIA_BYTES){
    alert(`That file is ${(file.size/1024/1024).toFixed(1)}MB. Please choose something under ${(MAX_MEDIA_BYTES/1024/1024).toFixed(0)}MB so it saves reliably to the shared calendar.`);
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    currentMedia = { type: isVideo ? 'video' : 'image', data: reader.result, name: file.name, size: file.size };
    renderMediaPreview();
  };
  reader.onerror = ()=>alert('Could not read that file, please try again.');
  reader.readAsDataURL(file);
}

function openEditor(id, prefillDate){
  editingId = id;
  const existing = id ? posts.find(p=>p.id===id) : null;
  $('modalTitle').textContent = existing ? 'Edit post' : 'New post';
  $('fTitle').value = existing ? existing.title : '';
  $('fDate').value = existing ? existing.date : (prefillDate || dateKey(viewYear, viewMonth, 1));
  $('fNotes').value = existing ? existing.notes || '' : '';
  currentPlatform = existing ? existing.platform : 'instagram';
  currentStatus = existing ? existing.status : 'idea';
  currentMedia = existing && existing.media ? existing.media : null;
  $('fMedia').value = '';
  renderMediaPreview();
  buildSeg($('fPlatform'), PLATFORMS, currentPlatform, (id)=>currentPlatform=id);
  buildSeg($('fStatus'), STATUSES, currentStatus, (id)=>currentStatus=id);
  $('deleteBtn').style.visibility = existing ? 'visible' : 'hidden';
  $('overlay').classList.add('show');
  $('fTitle').focus();
}
function closeEditor(){ $('overlay').classList.remove('show'); editingId = null; }

async function saveCurrentPost(){
  const title = $('fTitle').value.trim();
  if(!title){ $('fTitle').focus(); return; }
  const date = $('fDate').value || dateKey(viewYear, viewMonth, 1);
  const notes = $('fNotes').value.trim();

  if(editingId){
    const p = posts.find(p=>p.id===editingId);
    if(p){ Object.assign(p, {title, date, notes, platform: currentPlatform, status: currentStatus, media: currentMedia}); }
  } else {
    posts.push({
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      title, date, notes,
      platform: currentPlatform, status: currentStatus, media: currentMedia,
      createdAt: Date.now()
    });
  }
  const ok = await savePosts();
  if(ok === false) return; // keep modal open so nothing is lost
  closeEditor();
  renderGrid();
}

async function deleteCurrentPost(){
  if(!editingId) return;
  posts = posts.filter(p=>p.id!==editingId);
  await savePosts();
  closeEditor();
  renderGrid();
}

function shiftMonth(delta){
  viewMonth += delta;
  if(viewMonth<0){viewMonth=11; viewYear--;}
  if(viewMonth>11){viewMonth=0; viewYear++;}
  renderGrid();
}

async function init(){
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth();
  if(!supabaseReady){
    $('setupBanner').style.display = 'block';
    if(supabaseLibMissing){
      $('setupBanner').innerHTML = '<strong>Connection library didn\'t load —</strong> this is usually a temporary network hiccup. Try reloading the page. Posts won\'t save until this loads successfully.';
    }
  }
  buildFilters();
  renderGrid(); // show the calendar shape immediately, posts fill in once loaded
  await loadPosts();
  renderGrid();

  $('prevBtn').onclick = ()=>shiftMonth(-1);
  $('nextBtn').onclick = ()=>shiftMonth(1);
  $('todayBtn').onclick = ()=>{ const n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth(); renderGrid(); };
  $('newPostBtn').onclick = ()=>openEditor(null);
  $('saveAllBtn').onclick = manualSave;
  $('refreshBtn').onclick = async ()=>{ await loadPosts(); renderGrid(); };
  $('cancelBtn').onclick = closeEditor;
  $('saveBtn').onclick = saveCurrentPost;
  $('deleteBtn').onclick = deleteCurrentPost;
  $('fMedia').onchange = (e)=>handleMediaFile(e.target.files[0]);
  $('dayCloseBtn').onclick = closeDayModal;
  $('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeEditor(); };
  $('dayOverlay').onclick = (e)=>{ if(e.target.id==='dayOverlay') closeDayModal(); };

  // light polling so teammates' changes show up without a manual refresh
  setInterval(async ()=>{
    if(!$('overlay').classList.contains('show') && !$('dayOverlay').classList.contains('show')){
      await loadPosts(); renderGrid();
    }
  }, 20000);
}

async function manualSave(){
  const btn = $('saveAllBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  const ok = await savePosts();
  btn.textContent = ok ? 'Saved ✓' : 'Try again';
  setTimeout(()=>{ btn.textContent = 'Save'; btn.disabled = false; }, 1500);
}

init();
</script>
</body>
</html>
